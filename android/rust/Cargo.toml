[package]
name = "spotifast-android"
version = "0.13.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Spotifast's native core, exposed to Kotlin over UniFFI"

[lib]
name = "spotifast_android"
crate-type = ["cdylib", "lib"]

[dependencies]
spotifast-core = { path = "../../core" }
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
android_logger = "0.15"
log = "0.4"
# librespot logs through `tracing`, which android_logger's `log` backend never
# sees: a failed connect showed up only as the UI's one-line error. Emitting
# `log` records from those events puts the real cause (and the host it dialed)
# in logcat. `log-always`, not `log`, because no tracing subscriber is
# installed here.
tracing = { version = "0.1", features = ["log-always"] }
# Bootstraps ndk-context (below) so cpal's AAudio backend, deep inside
# spotifast-core's AndroidSink, can reach the JVM/Context it needs.
jni = "0.22"
ndk-context = "0.1"
petname = "3"
