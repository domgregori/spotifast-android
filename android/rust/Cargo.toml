[package]
name = "spotifast-android"
version = "0.13.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Spotifast's native core, exposed to Kotlin over UniFFI"

[lib]
name = "spotifast_android"
crate-type = ["cdylib", "lib"]

[dependencies]
spotifast-core = { path = "../../core" }
uniffi = { version = "0.32", features = ["cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
