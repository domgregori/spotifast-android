[package]
name = "spotifast-core"
version = "0.13.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Spotifast's portable core: auth, credentials, playback/Connect, Web API data access, and the tokio bridge, shared by the desktop binary and the Android library."
repository = "https://github.com/crmne/spotifast"
keywords = ["spotify", "music", "librespot", "player"]
categories = ["multimedia::audio"]

# Portable modules move here from the desktop crate (HANDOFF.md Phase A).
# Dependencies are added as modules arrive. The librespot fork and the
# egui/winit/hyper-proxy2 patches live in the workspace root's [patch.crates-io]
# and apply to this member too.

[lib]
name = "spotifast_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks"] }
# Same System-proxy matcher reqwest uses, so local playback follows the same
# HTTP proxy. Used by proxy.rs's system-proxy detection.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# zeroconf.rs's ZeroConf login (AES-CTR + HMAC-SHA1 + PBKDF2) and discovery.
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
pbkdf2 = "0.12"
mdns-sd = "0.21"
# cast.rs's Cast v2 device-auth handshake (TLS + SHA-1 signatures).
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
ring = "0.17"
rand = "0.9"
directories = "6"
urlencoding = "2"
percent-encoding = "2"
jiff = "0.2"
# Playlist cover uploads: decode/re-encode JPEG and PNG artwork.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# auth.rs needs reqwest; eq.rs needs librespot's channel/sample-rate constants.
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
# http.rs's tests exercise librespot's proxy URL handling.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
# credentials.rs's tests construct a stored-credentials grant.
librespot-protocol = { version = "0.8", default-features = false }
# session_reads.rs reads catalogue data through the playback session.
librespot-metadata = { version = "0.8", default-features = false }
# player.rs owns the Spirc Connect device and its state.
librespot-connect = { version = "0.8", default-features = false }
# session_reads.rs parses the rootlist's playlist4 protobuf.
protobuf = "3"

# Durable grants go in the platform credential store. keyring-core has no
# Android backend; the Android arm will arrive via a UniFFI callback (HANDOFF
# Phase A). Each desktop target's native provider below.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring-core = "1"
# The desktop audio device stream and the rodio mixer/queue fill the sink.
fastframe-audio = { git = "https://github.com/crmne/fastframe", rev = "3339a8bc524a51c47f87ca78c368dde3569d90f5" }
rodio = { version = "0.21", default-features = false }
# MilkDrop's shared-memory audio ring (memmap2).
memmap2 = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
# auth.rs's tests pause the tokio clock (start_paused).
tokio = { version = "1", features = ["test-util"] }

[features]
# Enables the in-memory credential backend used by the desktop crate's tests.
test-support = []
